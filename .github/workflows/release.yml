name: Release

# Se dispara con un tag vX.Y.Z:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    name: Escanear, publicar y crear el release
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # mover el tag vX y crear el release
      packages: write   # publicar en GHCR
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Versión
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::El tag '$GITHUB_REF_NAME' no tiene el formato vX.Y.Z"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          {
            echo "full=${major}.${minor}.${patch}"
            echo "minor=${major}.${minor}"
            echo "major=${major}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: La versión no debe existir
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          FULL: ${{ steps.version.outputs.full }}
        run: |
          if docker manifest inspect "$IMAGE:$FULL" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$FULL ya existe. Las versiones publicadas no se sobrescriben; crea un tag nuevo."
            exit 1
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: code-review-multiagent:release
          build-args: |
            VERSION=${{ steps.version.outputs.full }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Escaneo de vulnerabilidades
        # Fijada por SHA (v0.36.0): esta Action sufrió un ataque de cadena de suministro y
        # sus tags se republicaron con prefijo "v"; un SHA no se puede mover.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: code-review-multiagent:release
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Se publica exactamente la imagen escaneada (no se reconstruye).
      - name: Publicar en GHCR
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          FULL: ${{ steps.version.outputs.full }}
          MINOR: ${{ steps.version.outputs.minor }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          for tag in "$FULL" "$MINOR" "$MAJOR"; do
            docker tag code-review-multiagent:release "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done

      - name: Mover el tag de git vX
        env:
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git tag -f "v$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/v$MAJOR"

      - name: Crear el GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
